info:
    app:
        name: ${spring.application.name}
        description: Eureka Service to register multiple instances in a common name
        version: 1.0.0
server:
    port: 8761
    shutdown: graceful
spring:
    application:
        name: eureka-service
    lifecycle:
        timeout-per-shutdown-phase: 30s
management:
    endpoints:
        web:
            exposure:
                include: health,info,env,metrics
    endpoint:
        health:
            probes:
                enabled: true
            show-details: always
    info:
        env:
            enabled: true
    tracing:
        sampling:
            probability: 1.0
    opentelemetry:
        resource-attributes:
            service.name: ${spring.application.name}
        tracing:
            export:
                otlp:
                    endpoint: ${TEMPO_URL}
    prometheus:
        metrics:
            export:
                enabled: true
logging:
    file:
        name: ./deploy/logs/${spring.application.name}.log
    pattern:
        correlation: "[%X{traceId:-},%X{spanId:-}]"
    level:
        root: info
        com.shopsense: trace
eureka:
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90
    client:
        fetch-registry: false
        register-with-eureka: false
    server:
        enable-self-preservation: false
        eviction-interval-timer-in-ms: 60000
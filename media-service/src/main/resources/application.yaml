info:
    app:
        name: ${spring.application.name}
        description: Media Service to perform operations related to file uploads
        version: 1.0.0
server:
    port: 8084
    shutdown: graceful
spring:
    application:
        name: media-service
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 20MB
    jackson:
        deserialization:
            fail-on-unknown-properties: true
    lifecycle:
        timeout-per-shutdown-phase: 30s
    mongodb:
        host: ${MONGODB_HOST}
        port: ${MONGODB_PORT}
        username: ${MONGODB_USERNAME}
        password: ${MONGODB_PASSWORD}
        database: ${MEDIA_SERVICE_DATABASE}
        authentication-database: ${MONGODB_AUTHENTICATION_DATABASE}
        representation:
            uuid: standard
    data:
        mongodb:
            auto-index-creation: true
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,env,prometheus
    endpoint:
        health:
            show-details: always
    info:
        env:
            enabled: true
    tracing:
        sampling:
            probability: 1.0
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        resource-attributes:
            service.name: ${spring.application.name}
        tracing:
            export:
                otlp:
                    endpoint: ${TEMPO_URL}
    prometheus:
        metrics:
            export:
                enabled: true
logging:
    file:
        name: ./deploy/logs/${spring.application.name}.log
    pattern:
        correlation: "[%X{traceId:-},%X{spanId:-}]"
    level:
        root: info
        com.shopsense: trace
eureka:
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90
    client:
        service-url:
            defaultZone: ${EUREKA_URL}
        register-with-eureka: true
        fetch-registry: true
cloudinary:
    cloud-name: ${CLOUDINARY_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

name: shop-sense

services:

    # ============================================================
    # INFRASTRUCTURE
    # ============================================================

    mongodb:
        container_name: mongodb
        image: mongo:8.3.8-noble
        restart: unless-stopped
        tty: true
        ports:
            - "27017:27017"
        env_file:
            - ../.env.docker
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
            MONGO_INITDB_DATABASE: ${USER_SERVICE_DATABASE}
            GLIBC_TUNABLES: "glibc.pthread.rseq=1"
        volumes:
            - /home/vicky/Projects/ShopSense/data/mongodb:/data/db:z
        networks:
            - infra_network
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "mongosh --username ${MONGODB_USERNAME} --password ${MONGODB_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1"
              ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    mysql-cleanup:
        image: busybox:latest
        container_name: mysql-cleanup
        command: >
            sh -c "
            rm -f /var/lib/mysql/mysql.sock &&
            rm -f /var/lib/mysql/mysql.sock.lock
            "
        volumes:
            - /home/vicky/Projects/ShopSense/data/mysql:/var/lib/mysql:z
        restart: "no"
        networks:
            - infra_network

    mysql:
        container_name: mysql
        image: mysql:8.4
        restart: unless-stopped
        tty: true
        depends_on:
            mysql-cleanup:
                condition: service_completed_successfully
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_DATABASE: catalog_service
            GLIBC_TUNABLES: "glibc.pthread.rseq=1"
        volumes:
            - /home/vicky/Projects/ShopSense/data/mysql:/var/lib/mysql:z
            - /home/vicky/Projects/ShopSense/server/deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
        networks:
            - infra_network
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_PASSWORD} --silent || exit 1"
              ]
            interval: 5s
            timeout: 5s
            retries: 50
            start_period: 20s

    postgres:
        container_name: postgres
        image: postgres:18-alpine
        restart: on-failure
        tty: true
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USERNAME}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: order_service
        volumes:
            - /home/vicky/Projects/ShopSense/data/postgres:/var/lib/postgresql:z
        networks:
            - infra_network
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${POSTGRES_USERNAME} -d order_service"
              ]
            interval: 5s
            timeout: 5s
            retries: 50

    redis:
        container_name: redis
        image: redis:8-alpine
        restart: on-failure
        tty: true
        ports:
            - "6379:6379"
        command:
            - redis-server
            - --aclfile
            - /usr/local/etc/redis/users.acl
        volumes:
            - /home/vicky/Projects/ShopSense/data/redis:/data:z
            - /home/vicky/Projects/ShopSense/data/redis/users.acl:/usr/local/etc/redis/users.acl:ro,z
        networks:
            - infra_network
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "redis-cli --user root --pass root ping | grep PONG"
              ]
            interval: 5s
            timeout: 5s
            retries: 50

    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.3.6-management-alpine
        restart: unless-stopped
        tty: true
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
        volumes:
            - /home/vicky/Projects/ShopSense/data/rabbitmq:/var/lib/rabbitmq:z
        networks:
            - infra_network
        healthcheck:
            test:
              [
                  "CMD",
                  "rabbitmq-diagnostics",
                  "-q",
                  "ping"
              ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s


    # ============================================================
    # OBSERVABILITY
    # ============================================================

    prometheus:
        container_name: prometheus
        image: prom/prometheus:v3.13.3
        restart: unless-stopped
        tty: true
        ports:
            - "9090:9090"
        volumes:
            - /home/vicky/Projects/ShopSense/server/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
            - /home/vicky/Projects/ShopSense/data/prometheus:/prometheus:z
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
        networks:
            - dev_network
            - track_network

    loki:
        container_name: loki
        image: grafana/loki:3.7.8
        restart: unless-stopped
        tty: true
        ports:
            - "3100:3100"
        volumes:
            - /home/vicky/Projects/ShopSense/server/deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro,z
            - /home/vicky/Projects/ShopSense/data/loki:/loki:z
        command:
            - "-config.file=/etc/loki/loki-config.yml"
        networks:
            - track_network

    tempo:
        container_name: tempo
        image: grafana/tempo:3.0.3
        restart: unless-stopped
        tty: true
        ports:
            - "3200:3200"
            - "4317:4317"
            - "4318:4318"
        volumes:
            - /home/vicky/Projects/ShopSense/server/deploy/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,z
            - /home/vicky/Projects/ShopSense/data/tempo:/var/tempo:z
        command:
            - "-config.file=/etc/tempo/tempo.yml"
        networks:
            - dev_network
            - track_network

    grafana:
        container_name: grafana
        image: grafana/grafana:13.2-slim
        restart: unless-stopped
        tty: true
        ports:
            - "3000:3000"
        volumes:
            - /home/vicky/Projects/ShopSense/data/grafana:/var/lib/grafana:z
            - /home/vicky/Projects/ShopSense/server/deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
        depends_on:
            - prometheus
            - loki
            - tempo
        networks:
            - track_network

    alloy:
        container_name: alloy
        image: grafana/alloy:v1.19.0
        restart: unless-stopped
        tty: true
        ports:
            - "12345:12345"
        volumes:
            - /home/vicky/Projects/ShopSense/server/deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
            - /home/vicky/Projects/ShopSense/server/deploy/logs:/shopsense:ro,z
            - /home/vicky/Projects/ShopSense/data/alloy:/var/lib/alloy:z
            - /var/run/docker.sock:/var/run/docker.sock:ro
        command:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
        depends_on:
            - loki
        networks:
            - track_network



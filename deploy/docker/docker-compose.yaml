# ================================================================
# NETWORKS
# ================================================================

networks:

    dev_network:
        name: shop-sense-dev
        driver: bridge

    infra_network:
        name: shop-sense-infra
        driver: bridge

    track_network:
        name: shop-sense-track
        driver: bridge